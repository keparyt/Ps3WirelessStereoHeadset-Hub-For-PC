name: Release

# A version tag (v1.2.10, v1.3.0, ...) builds the distributable zip and the
# standalone installer exe on Windows and attaches them, together with the
# documentation screenshots, to a GitHub Release. The build tool derives the
# version resource from app/ps3hub/__init__.py, so keep APP_VERSION in sync
# with the tag before tagging.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt numpy pyinstaller pytest

      - name: Check the tag matches APP_VERSION
        shell: pwsh
        run: |
          $text = Get-Content app/ps3hub/__init__.py -Raw
          $match = [regex]::Match($text, 'APP_VERSION\s*=\s*"([^"]+)"')
          if (-not $match.Success) { Write-Error 'APP_VERSION not found'; exit 1 }
          $version = $match.Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($version -ne $tag) {
            Write-Error "Tag v$tag does not match APP_VERSION $version - bump APP_VERSION and re-tag."
            exit 1
          }
          Write-Host "Tag v$tag matches APP_VERSION $version"

      - name: Run the test suite
        working-directory: app
        run: python -m pytest tests/ -q

      - name: Build the onedir app and the distributable zip
        working-directory: app
        run: python packaging/build_exe.py --clean

      - name: Build the standalone installer exe
        working-directory: app
        run: python packaging/build_installer.py --skip-smoke

      - name: Attach the artifacts to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/PS3HeadsetHub-*-win64.zip
            build/PS3HeadsetHubInstaller.exe
            build/build-report.txt
            app/docs/*.png
          generate_release_notes: true
          fail_on_unmatched_files: true
