name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt numpy pyinstaller pytest

      - name: Run the test suite
        working-directory: app
        run: python -m pytest tests/ -q --tb=short --junitxml=test-results.xml

      - name: Report test failures as annotations
        if: failure()
        working-directory: app
        shell: pwsh
        run: |
          if (Test-Path test-results.xml) {
            [xml]$x = Get-Content test-results.xml
            $x.testsuites.testsuite.testcase |
              Where-Object { $_.failure } |
              ForEach-Object {
                $msg = ($_.failure.message -replace "`r?`n", ' ')
                Write-Output "::error::$($_.classname).$($_.name) :: $msg"
              }
          }
